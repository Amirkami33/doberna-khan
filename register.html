
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>ثبت‌نام | دبرنا خان</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-logo">

        <div class="logo-crown">♛</div>

        <h1>دبرنا خان</h1>

        <span>عضو خانواده دبرنا شو</span>

    </div>


    <div class="auth-card">

        <h2>ساخت حساب</h2>

        <p class="auth-subtitle">
            ثبت‌نام کن و ۵۰۰ سکه هدیه بگیر 🎁
        </p>


        <form id="registerForm">

            <div class="input-group">

                <label>نام کاربری</label>

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="مثلاً amirkami"
                    minlength="3"
                    maxlength="20"
                    required>

            </div>


            <div class="input-group">

                <label>رمز عبور</label>

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="حداقل ۶ کاراکتر"
                    minlength="6"
                    required>

            </div>


            <div class="input-group">

                <label>تکرار رمز عبور</label>

                <input
                    id="registerPassword2"
                    type="password"
                    placeholder="رمز عبور را دوباره وارد کنید"
                    minlength="6"
                    required>

            </div>


            <button type="submit" class="primary-btn">
                ساخت حساب
            </button>

        </form>


        <div id="registerMessage" class="form-message"></div>


        <div class="bonus-box">

            <span>🎁</span>

            <div>

                <strong>۵۰۰ سکه هدیه</strong>

                <small>
                    بعد از ثبت‌نام به موجودی شما اضافه می‌شود
                </small>

            </div>

        </div>


        <div class="auth-footer">

            <span>قبلاً حساب ساختی؟</span>

            <a href="login.html">
                ورود
            </a>

        </div>

    </div>


    <div class="auth-note">
        🪙 تمام سکه‌ها مجازی هستند
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
